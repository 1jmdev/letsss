[workspace]
resolver = "3"
members = ["crates/inspection", "crates/inspection_cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
console = "0.16"
dirs = "7.0"
flate2 = "1.1"
forensic-rs = "0.13"
frnsc-prefetch = "0.13"
goblin = "0.10"
indicatif = "0.18"
inspection = { path = "crates/inspection" }
is_elevated = "0.1"
jiff = "1.0"
nt-time = "0.15"
procfs = "0.18"
rayon = "1.12"
runas = "1.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2.0"
toml = "1.2"
usn-journal-rs = "0.5"
walkdir = "2.5"
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winreg = "0.56"
zip = { version = "9.6", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
